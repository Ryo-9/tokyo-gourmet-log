        var actual=resolve(mode);
        document.documentElement.dataset.theme=actual;
        document.documentElement.style.colorScheme=actual;
        var m=document.querySelector('meta[name="theme-color"]');
        if(m)m.setAttribute('content',actual==='dark'?'#191b1a':'#f8f7f3');

      window.__tglApplyTheme(preference,false);

      });
    })();

    /* v3.1: neutral editorial theme — modern, photo-first light/dark modes */
    :root {
      color-scheme:light;
      --bg:#f7f8fa; --panel:#ffffff; --panel2:#f1f2f5; --border:#e4e6eb;
      --fg:#181a20; --muted:#626978; --accent:#d92756; --accent2:#b82349;
      --teal:#087e63; --danger:#b52548; --radius:16px;
      --surface-raised:#ffffff; --soft-shadow:0 5px 20px #10121608; --placeholder:#e9ebef;
    }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --bg:#111216; --panel:#1d1e23; --panel2:#282a30; --border:#373940;
      --fg:#f4f4f6; --muted:#b0b3bd; --accent:#ff6589; --accent2:#ff8aa2;
      --teal:#62d2b6; --danger:#ff8c9a; --radius:16px;
      --surface-raised:#23242a; --soft-shadow:0 6px 24px #0000002c; --placeholder:#30333a;
    }
    html,body{background:var(--bg)!important;color:var(--fg)!important}
    body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;letter-spacing:-.006em}
    .main{background:transparent}
    .theme-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:-3px 0 12px;min-height:40px}
    .theme-toolbar .theme-label{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
    .theme-toggle{display:inline-flex;align-items:center;gap:7px;background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:999px;padding:7px 12px;min-height:38px;font-size:12px;font-weight:750;box-shadow:var(--soft-shadow)}
    .theme-toggle .theme-symbol{font-size:16px;line-height:1}
    .theme-toggle:hover{border-color:var(--accent)}
    :is(button,input,select,textarea,a):focus-visible{outline:3px solid var(--accent)!important;outline-offset:3px}
    .side{background:var(--panel)!important;border-color:var(--border)!important}
    .brand-title{color:var(--fg)!important}.brand-small,.eyebrow,.shop .shop-ward{color:var(--accent)!important}
    .brand-mark{background:var(--panel2)!important;color:var(--accent)!important}
    .nav-item:hover{background:var(--panel2)!important;color:var(--fg)!important}
    .nav-item.active{background:var(--panel2)!important;color:var(--accent)!important;box-shadow:inset 3px 0 0 var(--accent)!important}
    .welcome,.stat,.controls,.panel,.shop,.history-card,.social-result,.social-match,.big-empty,
    .privacy-note,.social-hero,.hero,.discover-card,.nearby-panel,.data-preview{
      background:var(--panel)!important;color:var(--fg)!important;border:1px solid var(--border)!important;box-shadow:var(--soft-shadow)!important
    }
    .welcome{border-radius:20px;padding:20px}
    .welcome h1{color:var(--fg)!important;letter-spacing:-.04em}
    .welcome p,.lead,.hero-desc,.social-hero p,.nearby-panel p,.nearby-panel small,
    .stat-label,.stat-detail,.shop .shop-genre,.visit-meta,.visit-note,.privacy-note,
    .info-note,.muted,.photo-hint,.foot{color:var(--muted)!important}
    .welcome-sub{color:var(--accent)!important;letter-spacing:.09em}
    .stat-num{color:var(--fg)!important}.stat-detail{font-size:11px}
    .stat{border-radius:15px}.stats{gap:9px}
    .btn,.btn.ghost,.social-kpis .btn{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:11px}
    .btn.primary,.btn-gold{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
    :root[data-theme="dark"] .btn.primary,:root[data-theme="dark"] .btn-gold{color:#16151b!important}
    .btn.primary:hover{filter:brightness(.94)}.btn:hover{border-color:var(--muted)}
    .btn.danger{color:var(--danger);border-color:var(--border)}
    .btn.olive{color:var(--teal);border-color:var(--border)}
    .settings-button{background:var(--panel2)!important;color:var(--fg)!important;min-width:44px;min-height:44px}
    .action-tile.coral,.action-tile.mint,.action-tile.yellow{
      background:var(--panel2)!important;color:var(--fg)!important;border:1px solid var(--border);
      border-radius:15px;box-shadow:none;transition:transform .12s ease,border-color .12s ease
    }
    .action-tile:active{transform:scale(.975)}
    .action-tile span{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;
      background:var(--panel);color:var(--accent);border:1px solid var(--border)}
    .action-tile small{color:var(--muted)!important;font-size:10px}
    .action-tile b{font-size:12px;letter-spacing:-.02em}
    .home-title,.section-title h2,.hero-heading,.shop .shop-name,.panel h3{color:var(--fg)!important}
    .genre-chips button,.chip{background:var(--panel)!important;color:var(--fg)!important;border:1px solid var(--border)!important}
    .genre-chips button:active,.genre-chips button:hover{border-color:var(--accent)!important;color:var(--accent)!important}
    .chip.wish{background:var(--panel2)!important;color:var(--accent)!important;border-color:var(--accent)!important}
    .chip.visited{background:var(--panel2)!important;color:var(--teal)!important;border-color:var(--border)!important}
    .controls{border-radius:17px}.shop{border-radius:16px;transition:transform .15s ease,box-shadow .15s ease}
    .shop:hover{transform:translateY(-2px);border-color:var(--border)!important}
    .food-photo.no-photo,.shop:nth-child(3n+2) .food-photo.no-photo,.shop:nth-child(3n+3) .food-photo.no-photo{
      background:linear-gradient(145deg,var(--placeholder),var(--panel2))!important
    }

      color:var(--fg)!important;background:var(--panel)!important;border:1px solid var(--border)
    }
    .shop .shop-name{font-weight:770}.shop .shop-bottom .btn{background:var(--panel2)}
    .info-note{border-left-color:var(--accent)}
    input,textarea,select{background:var(--panel2)!important;color:var(--fg)!important;border:1px solid var(--border)!important}
    input::placeholder,textarea::placeholder{color:var(--muted);opacity:.9}
    input:focus,textarea:focus,select:focus{border-color:var(--accent)!important}
    dialog{background:var(--panel)!important;color:var(--fg)!important;border:1px solid var(--border)!important;box-shadow:0 18px 80px #0006!important}
    dialog::backdrop{background:#0009}
    .modal-head{border-color:var(--border)!important}
    .close{background:var(--panel2)!important;color:var(--fg)!important;min-height:40px;min-width:40px}
    .field>span{color:var(--fg)!important}
    .history-card{border-radius:13px}
    .photo-upload{background:var(--panel2)!important;color:var(--accent)!important}
    .photo-hint{background:var(--panel2)!important}
    .photo-tile{border:1px solid var(--border)}
    .sns-tag,.small-title,.social-link{color:var(--accent)!important}
    .social-match-title{color:var(--fg)!important}
    .source-chip{border-color:var(--border)!important;color:var(--accent)!important;background:var(--panel2)}
    .toast{background:var(--fg)!important;color:var(--bg)!important;box-shadow:0 12px 35px #0004}
    .progress-row .track{background:var(--panel2)}.progress-row .fill{background:var(--accent)}
    .kbd{background:var(--panel2);color:var(--fg)}
    .social-form-grid{color:var(--fg)}
    .bottom-nav{background:var(--panel)!important;border-top:1px solid var(--border)!important;
      box-shadow:0 -5px 22px #0000000a!important}
    .bottom-nav button{color:var(--muted)!important;min-height:52px}
    .bottom-nav button.active{color:var(--accent)!important;font-weight:800}
    :root[data-theme="dark"] .bottom-nav{box-shadow:0 -5px 20px #0005!important}
    :root[data-theme="dark"] .btn.primary,:root[data-theme="dark"] .btn-gold{color:#18171c!important}

    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function readStore(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object'&&Array.isArray(v.custom)&&Array.isArray(v.visits)){return {...defaultState(),...v};}}catch(e){}return defaultState();}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){toast('保存に失敗しました。ブラウザの容量を確認してください。')}}
    function getShops(){return [...SEED,...store.custom].filter(s=>!store.hidden.includes(s.id)).map(s=>({...s,...(store.mods[s.id]||{})}));}
    function getShop(id){return getShops().find(s=>s.id===id)}
    function getVisits(id){return store.visits.filter(v=>v.shopId===id).sort((a,b)=>b.date.localeCompare(a.date))}
    function statusOf(shop){return shop.status || (getVisits(shop.id).length?'visited':'new')}
    function setStatus(id,status){if(!getShop(id))return;store.mods[id]={...(store.mods[id]||{}),status};save();render();toast(status==='wish'?'「行きたい」に保存しました':status==='visited'?'訪問済みにしました':'ステータスを更新しました')}
    function stats(){let s=getShops(),wish=s.filter(x=>statusOf(x)==='wish'),visited=s.filter(x=>statusOf(x)==='visited');let rated=store.visits.filter(v=>Number(v.rating)>0);return {total:s.length,wish:wish.length,visited:visited.length,logs:store.visits.length,wards:new Set(visited.map(x=>x.ward)).size,avg:rated.length?(rated.reduce((a,b)=>a+Number(b.rating),0)/rated.length).toFixed(1):'-'}}
    function mapUrl(shop){const coords=Number.isFinite(Number(shop.lat))&&Number.isFinite(Number(shop.lon))?shop.name+' '+Number(shop.lat).toFixed(5)+','+Number(shop.lon).toFixed(5):'東京都 '+shop.ward+' '+shop.name;return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(coords)}
    function iconNav(tab){let row=NAV.find(n=>n[0]===tab);return row?row[1]:''}

    // 写真はブラウザのIndexedDBに保存。JSONバックアップには画像バイナリを含めない。
    let photoItems=new Map(); let photoObjects=new Map();let photoDb=null;
    function photoDB(){if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDBに対応していません'));if(photoDb)return Promise.resolve(photoDb);
      return new Promise((ok,no)=>{const req=indexedDB.open('tgy-gourmet-photos-v3',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=()=>{photoDb=req.result;ok(photoDb)};req.onerror=()=>no(req.error)});}
    async function loadPhotos(){try{const db=await photoDB();const list=await new Promise((ok,no)=>{const tx=db.transaction('photos','readonly'),req=tx.objectStore('photos').getAll();req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)});for(const u of photoObjects.values())URL.revokeObjectURL(u);photoObjects=new Map();photoItems=new Map();for(const item of list){if(!photoItems.has(item.shopId))photoItems.set(item.shopId,[]);photoItems.get(item.shopId).push(item);photoObjects.set(item.id,URL.createObjectURL(item.blob))}render();}catch(e){console.warn('photo storage unavailable',e)}}
    async function addPhotoFile(shopId,file){if(!file?.type?.startsWith('image/')){toast('画像ファイルを選んでください');return;}if(file.size>15*1024*1024){toast('15MB以下の写真を選んでください');return;}
      try{const bitmap=await createImageBitmap(file),scale=Math.min(1,1440/Math.max(bitmap.width,bitmap.height)),cv=document.createElement('canvas');cv.width=Math.round(bitmap.width*scale);cv.height=Math.round(bitmap.height*scale);cv.getContext('2d').drawImage(bitmap,0,0,cv.width,cv.height);bitmap.close?.();const blob=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.78));if(!blob)throw Error('画像変換失敗');
      const db=await photoDB(),id='photo-'+Date.now()+'-'+Math.random().toString(36).slice(2);await new Promise((ok,no)=>{const req=db.transaction('photos','readwrite').objectStore('photos').put({id,shopId,blob,createdAt:new Date().toISOString()});req.onsuccess=ok;req.onerror=()=>no(req.error)});await loadPhotos();detail(shopId);toast('写真を保存しました');}catch(e){console.error(e);toast('写真を保存できませんでした')}}
    async function deletePhotoFile(id){try{const db=await photoDB();await new Promise((ok,no)=>{const req=db.transaction('photos','readwrite').objectStore('photos').delete(id);req.onsuccess=ok;req.onerror=()=>no(req.error)});await loadPhotos();toast('写真を削除しました')}catch(e){toast('写真を削除できませんでした')}}

    async function exportPhotoBackup(){try{const db=await photoDB(),list=await new Promise((ok,no)=>{const rq=db.transaction('photos','readonly').objectStore('photos').getAll();rq.onsuccess=()=>ok(rq.result);rq.onerror=()=>no(rq.error)});const photos=[];for(const item of list){const data=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>no(f.error);f.readAsDataURL(item.blob)});photos.push({id:item.id,shopId:item.shopId,createdAt:item.createdAt,data});}const out={format:'tokyo-gourmet-photo-backup',version:1,exportedAt:new Date().toISOString(),photos};const blob=new Blob([JSON.stringify(out)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tokyo-gourmet-photos-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2500);toast(`${photos.length}枚の写真をバックアップしました`);}catch(e){console.error(e);toast('写真バックアップに失敗しました')}}
    async function importPhotoBackup(file){if(!file)return;try{if(file.size>100*1024*1024)throw Error('写真バックアップは100MB以下を選んでください');const parsed=JSON.parse(await file.text());if(parsed.format!=='tokyo-gourmet-photo-backup'||!Array.isArray(parsed.photos))throw Error('写真用バックアップを選んでください');if(!confirm(`${parsed.photos.length}枚の写真をこの端末に取り込みますか？同じIDの写真は上書きされます。`))return;const db=await photoDB();let count=0;for(const p of parsed.photos){if(typeof p.id!=='string'||typeof p.shopId!=='string'||typeof p.data!=='string'||!p.data.startsWith('data:image/'))continue;const blob=await fetch(p.data).then(r=>r.blob());await new Promise((ok,no)=>{const rq=db.transaction('photos','readwrite').objectStore('photos').put({id:p.id,shopId:p.shopId,blob,createdAt:p.createdAt||new Date().toISOString()});rq.onsuccess=ok;rq.onerror=()=>no(rq.error)});count++;}await loadPhotos();toast(`${count}枚の写真を取り込みました`);}catch(e){console.error(e);toast(e.message||'写真を取り込めませんでした')}}
    function photoVisual(shop,variant='card'){const items=photoItems.get(shop.id)||[],item=items[0];const icons={'麺・ラーメン':'ramen','洋食・バーガー':'burger','スイーツ・甘味':'cake','カフェ':'coffee','焼肉':'meat','中華・餃子':'ramen','和食・寿司':'utensils','カレー・エスニック':'curry','パン':'burger'};const genre=String(shop.genre||''),iconName=Object.entries(icons).find(([k])=>genre.includes(k)||k.includes(genre))?.[1]||'utensils';return item?`<div class="food-photo ${variant}"><img src="${photoObjects.get(item.id)}" alt="${esc(shop.name)}の登録写真" loading="lazy"><span class="photo-label">登録した写真</span></div>`:`<div class="food-photo ${variant} no-photo"><div class="food-icon" aria-hidden="true">${navIcon(iconName)}</div><span class="photo-label">写真なし</span></div>`;}
    function photoGallery(shop){let list=photoItems.get(shop.id)||[];return `<section class="photo-section"><div class="section-title"><h3>写真で思い出す <small>${list.length}枚</small></h3><label class="photo-upload">＋ 写真を追加<input id="photoUpload" data-shop="${esc(shop.id)}" type="file" accept="image/*" multiple hidden></label></div><div class="photo-gallery">${list.length?list.map(x=>`<div class="photo-tile"><button class="photo-open" type="button" data-action="viewPhoto" data-photo="${esc(x.id)}"><img src="${photoObjects.get(x.id)}" alt="${esc(shop.name)}の写真を拡大"></button><button type="button" data-action="deletePhoto" data-photo="${esc(x.id)}" data-id="${esc(shop.id)}" aria-label="写真を削除">×</button></div>`).join(''):'<p class="photo-hint">まだ写真がありません。食べた料理やお店の思い出を追加できます。</p>'}</div><p class="hint">写真はこの端末内だけに保存されます。JSONバックアップには写真が含まれません。</p></section>`}
    function renderNav(){
     for(const id of ["sideNav","bottomNav"]){
      const nav=id==="sideNav"?[...NAV,["data","settings","設定"]]:NAV;
      document.getElementById(id).innerHTML=nav.map(([tab,icon,label])=>
        `<button type="button" data-tab="${tab}" class="${id==="sideNav"?"nav-item":"bottom-nav-item"} ${ui.tab===tab?"active":""}" aria-label="${label}" ${ui.tab===tab?'aria-current="page"':""}>`+
          `<span class="nav-symbol" aria-hidden="true">${navIcon(icon)}</span><span class="nav-label">${label}</span></button>`
      ).join("");
     }
    }
    function pageHeader(eyebrow,title,desc,button){return `<div class="top"><div><div class="eyebrow">${esc(eyebrow)}</div><h1 class="h1">${esc(title)}</h1><p class="lead">${esc(desc)}</p></div>${button||''}</div>`}
    function statsHtml(){const s=stats();return `<div class="stats"><div class="stat"><div class="stat-label">登録されたお店</div><div class="stat-num">${s.total}<small style="font-size:13px;font-weight:500"> 軒</small></div><div class="stat-detail">東京23区から</div></div><div class="stat"><div class="stat-label">行きたいお店</div><div class="stat-num">${s.wish}</div><div class="stat-detail">次の目的地</div></div><div class="stat"><div class="stat-label">訪問済み</div><div class="stat-num">${s.visited}</div><div class="stat-detail">${s.wards}区を訪問</div></div><div class="stat"><div class="stat-label">訪問の記録</div><div class="stat-num">${s.logs}</div><div class="stat-detail">平均評価 ${s.avg} / 5</div></div></div>`}
    function filters(){return `<div class="controls"><div class="filter-grid"><div class="filter-search"><span class="magnify">⌕</span><input id="keyword" placeholder="店名・料理・区名を検索" autocomplete="off" value="${esc(ui.keyword)}" aria-label="お店を検索"/></div><select id="region"><option value="all">すべてのエリア</option>${REGIONS.map(x=>`<option ${ui.region===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="ward"><option value="all">すべての区</option>${WARDS.filter(w=>ui.region==='all'||SEED.some(s=>s.ward===w&&s.region===ui.region)).map(w=>`<option ${ui.ward===w?'selected':''}>${esc(w)}</option>`).join('')}</select><select id="genre"><option value="all">すべてのジャンル</option>${GENRES.map(g=>`<option ${ui.genre===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div class="control-foot"><div><select id="status" style="width:auto;min-height:34px;padding:5px 9px;font-size:12px"><option value="all" ${ui.status==='all'?'selected':''}>全ステータス</option><option value="new" ${ui.status==='new'?'selected':''}>未訪問</option><option value="wish" ${ui.status==='wish'?'selected':''}>行きたい</option><option value="visited" ${ui.status==='visited'?'selected':''}>訪問済み</option></select> <select id="sort" style="width:auto;min-height:34px;padding:5px 9px;font-size:12px"><option value="name" ${ui.sort==='name'?'selected':''}>店名順</option><option value="ward" ${ui.sort==='ward'?'selected':''}>区名順</option><option value="genre" ${ui.sort==='genre'?'selected':''}>ジャンル順</option></select></div><button class="small-link" data-action="clearFilters">条件を解除</button></div></div>`}
    function filtered(){let a=getShops().filter(s=>(ui.region==='all'||s.region===ui.region)&&(ui.ward==='all'||s.ward===ui.ward)&&(ui.genre==='all'||s.genre===ui.genre)&&(ui.status==='all'||statusOf(s)===ui.status));if(ui.tab==='wishlist')a=a.filter(s=>statusOf(s)==='wish');if(ui.tab==='visited')a=a.filter(s=>statusOf(s)==='visited');const q=ui.keyword.trim().toLocaleLowerCase('ja');if(q)a=a.filter(s=>[s.name,s.ward,s.region,s.genre,s.notes||''].join(' ').toLocaleLowerCase('ja').includes(q));a.sort((a,b)=>String(a[ui.sort==='ward'?'ward':ui.sort==='genre'?'genre':'name']).localeCompare(String(b[ui.sort==='ward'?'ward':ui.sort==='genre'?'genre':'name']),'ja'));return a}
    function tag(status){return status==='wish'?'<span class="chip wish">♡ 行きたい</span>':status==='visited'?'<span class="chip visited">✓ 訪問済み</span>':'<span class="chip">未訪問</span>'}
    function card(s){let st=statusOf(s);let visits=getVisits(s.id);let last=visits[0];return `<article class="shop"><button class="shop-visual-button" data-action="detail" data-id="${esc(s.id)}" aria-label="${esc(s.name)}の写真と詳細を開く">${photoVisual(s)}</button><div class="shop-content"><div class="shop-top"><div class="shop-ward">${esc(s.ward)}</div>${tag(st)}</div><h3 class="shop-name">${esc(s.name)}</h3><p class="shop-genre">${esc(s.genre)}</p>${last?`<p class="visit-small">${last.rating?'★ '+last.rating+' · ':''}${esc(last.date)} に訪問</p>`:''}<div class="shop-bottom"><button class="btn tiny ${st==='wish'?'olive':''}" data-action="wish" data-id="${esc(s.id)}">${st==='wish'?'♥ 保存済み':'♡ 行きたい'}</button><button class="btn tiny" data-action="detail" data-id="${esc(s.id)}">詳しく</button><button class="btn tiny ghost" data-action="map" data-id="${esc(s.id)}">地図 ↗</button></div></div></article>`}
    function resultsView(){let a=filtered(), shown=a.slice(0,ui.page*ui.perPage);return `<div id="results"><div class="section-title"><h2>${ui.tab==='wishlist'?'行きたいリスト':ui.tab==='visited'?'訪問済みのお店':'お店を見つける'} <small>${a.length}件</small></h2><span class="chip">${shown.length} / ${a.length} 表示</span></div>${a.length?`<div class="list-grid">${shown.map(card).join('')}</div>${shown.length<a.length?`<div style="text-align:center;margin:24px 0"><button class="btn" data-action="loadMore">さらに表示（残り${a.length-shown.length}件）</button></div>`:''}`:`<div class="big-empty"><strong>該当するお店がありません</strong>条件を変更するか、別のキーワードを試してください。<div style="margin-top:14px"><button class="btn tiny" data-action="clearFilters">絞り込み解除</button></div></div>`}`}

    function discover(){let s=getShop(ui.discoverId);if(!s){s=randomShop();ui.discoverId=s?.id}const ss=stats();let regions=REGIONS.map(r=>{let total=getShops().filter(s=>s.region===r).length,done=getShops().filter(s=>s.region===r&&statusOf(s)==='visited').length;return {r,total,done}});let topVisits=getShops().filter(s=>getVisits(s.id).some(v=>+v.rating>=4)).slice(0,4);return pageHeader('DISCOVER / YOUR NEXT BITE','まだ知らない、おいしさへ。','未訪問のお店からランダムで一軒ご提案。')+`<div class="hero"><div class="eyebrow">SPONTANEOUS DINNER</div><div class="hero-heading">いつもと違う街、<br>まだ知らない料理。</div><p class="hero-desc">検索条件を決めずに選んでみるのも、食べ歩きの楽しみ。ランダム抽選は未訪問のお店を優先します。</p><div class="hero-actions"><button class="btn primary" data-action="reroll">✦ もう一軒、発掘する</button><button class="btn" data-tab="explore">店舗を一覧で探す</button></div></div>${s?`<div class="discover-card"><div class="eyebrow">TODAY'S PICK</div><div style="margin-top:10px">${tag(statusOf(s))}</div><div class="shop-name">${esc(s.name)}</div><p class="muted">${esc(s.ward)} ・ ${esc(s.genre)}</p><div class="hero-actions"><button class="btn primary" data-action="wish" data-id="${esc(s.id)}">♡ 行きたいに登録</button><button class="btn" data-action="detail" data-id="${esc(s.id)}">詳しく見る</button><button class="btn ghost" data-action="map" data-id="${esc(s.id)}">↗ 地図を見る</button></div></div>`:''}<div class="two-col"><div class="panel"><h3>エリア別の達成率</h3>${regions.map(r=>`<div class="progress-row"><span>${r.r}</span><div class="track"><div class="fill" style="width:${r.total?Math.round(r.done/r.total*100):0}%"></div></div><span>${r.done}/${r.total}</span></div>`).join('')}</div><div class="panel"><h3>あなたのグルメログ</h3><p>訪問済み：<strong style="color:var(--accent)">${ss.visited}</strong>軒 / 訪問記録：<strong>${ss.logs}</strong>件</p><p>平均評価：<strong>${ss.avg}</strong> / 5</p><div class="divider"></div><h3>高評価のお店</h3>${topVisits.length?topVisits.map(x=>`<p><button class="small-link" data-action="detail" data-id="${esc(x.id)}">${esc(x.name)}</button> <span class="muted">${esc(x.wa     function dataPage(){return pageHeader('YOUR DATA / YOUR OWNERSHIP','記録を、安全に持ち運ぶ。','保存内容のバックアップと、ChatGPTへの共有を管理します。')+`<div class="two-col"><div class="panel"><div class="eyebrow">CHATGPT CONNECTION</div><h3 style="margin-top:11px">このチャットに相談する</h3><p>行きたいお店・訪問済み・評価を読みやすいテキストにまとめます。ボタンを押してコピー後、ChatGPTの会話に貼り付けてください。</p><button class="btn primary" data-action="share">相談用テキストをコピー</button><p class="hint">この機能は手動共有です。ChatGPTへの自動同期や会話の読み取りは行いません。</p></div><div class="panel"><div class="eyebrow">BACKUP & RESTORE</div><h3 style="margin-top:11px">JSONバックアップ</h3><p>訪問メモ・評価・行きたい登録を含むデータを保存できます。写真は端末内の別保存領域にあり、JSONには含まれません。別の端末への引き継ぎやChatGPTとのデータ交換に利用できます。</p><div class="inline-links"><button class="btn" data-action="export">データを書き出す</button><button class="btn" data-action="import">データを取り込む</button></div><div class="divider"></div><h3>写真のバックアップ</h3><p>登録した写真は別ファイルで書き出し・取り込みできます。スマホの機種変更前にデータと写真の両方を保存してください。</p><div class="inline-links"><button class="btn" data-action="exportPhotos">写真を書き出す</button><label class="btn photo-upload" style="cursor:pointer">写真を取り込む<input type="file" id="photoImportFile" accept=".json,application/json" hidden></label></div><p class="hint">データは現在のブラウザ内に保存されます。異なる端末間で自動同期しません。</p></div></div><div class="section-title"><h2>保存状態の確認</h2></div>${statsHtml()}<div class="panel"><h3>データの取り扱い</h3><p>アカウントを作成しなくても利用できます。ブラウザのデータを削除すると記録が失われることがあるため、定期的にJSONを書き出してください。</p><p>インポートはプレビュー・確認後に実行します。重複する店舗はIDを基準に統合し、インポート前に自動バックアップをダウンロードします。</p><p>新しい店舗はご自身で追加できます。店舗情報は公開・営業中を保証するものではありません。</p></div><div class="foot">TOKYO GOURMET LOG / v3.0 · 日本語 · 個人利用のための試作Webアプリ</div>`}
    function themeToolbar(){const dark=document.documentElement.dataset.theme==='dark';return '<div class="theme-toolbar"><span class="theme-label">表示モード</span><button type="button" class="theme-toggle" data-action="toggleTheme" aria-label="'+(dark?'ライトモードに切り替える':'ダークモードに切り替える')+'"><span class="theme-symbol" aria-hidden="true">'+(dark?'☀':'☾')+'</span><span>'+(dark?'ライト':'ダーク')+'に切替</span></button></div>';}

    function addShop(edit){let s=typeof edit==='string'?getShop(edit):null;let genres=[...new Set([...GENRES,...getShops().map(x=>x.genre)])].sort((a,b)=>a.localeCompare(b,'ja'));showDialog('addDialog',`<div class="modal-head"><div><div class="eyebrow">MY TOKYO GOURMET</div><h2>${s?'店舗情報を編集':'お店を追加する'}</h2></div><button class="close" data-action="close">×</button></div><div class="modal-body"><form id="addForm" data-edit="${s?esc(s.id):''}"><label class="field"><span>店名 *</span><input name="name" maxlength="160" value="${esc(s?.name||'')}" placeholder="例：北千住の気になるお店" required></label><div class="form-grid"><label class="field"><span>区 *</span><select name="ward" required><option value="">選択してください</option>${WARDS.map(x=>`<option ${s?.ward===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field"><span>ジャンル *</span><select name="genre" required>${genres.map(x=>`<option ${s?.genre===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div><label class="field"><span>メモ</span><textarea name="notes" maxlength="4000" placeholder="気になるメニューなど">${esc(s?.notes||'')}</textarea></label><div class="modal-actions"><button class="btn ghost" type="button" data-action="close">キャンセル</button><button type="submit" class="btn primary">${s?'変更を保存':'追加する'}</button></div></form></div>`)}

    function applyImport(mode){if(!incoming)return;if(!confirm(mode==='replace'?'今のデータをすべて置き換えますか？ 自動でバックアップを保存します。':'JSONの内容を既存データと統合しますか？ 事前にバックアップを保存します。'))return;downloadJson({format:'tokyo-gourmet-log',version:1,data:store},'tokyo-gourmet-log-before-import.json');if(mode==='replace'){store=incoming}else{const uniq=(a,b)=>Array.from(new Map([...a,...b].map(x=>[x.id,x])).values());store={version:1,mods:{...store.mods,...incoming.mods},custom:uniq(store.custom,incoming.custom),hidden:[...new Set([...store.hidden,...incoming.hidden])],visits:uniq(store.visits,incoming.visits),socialPins:uniq(socialPins(),incoming.socialPins)}}incoming=null;save();document.getElementById('importDialog').close();render();toast('データの取り込みが完了しました')}

    ${st.matches.length?`<div class="section-title"><h2>② 一致した店舗候補 <small>${st.matches.length}軒</small></h2></div><div class="match-grid">${st.matches.slice(0,8).map(s=>`<div class="social-match"><div><div class="social-match-title">${esc(s.name)}</div><span class="muted">${esc(s.ward)} · ${esc(s.genre)}</span></div><div class="inline-links"><button class="btn tiny primary" data-action="socialSaveExisting" data-id="${esc(s.id)}">♡ 行きたいに保存</button><button class="btn tiny" data-action="mapQuery" data-query="${esc('東京都 '+s.ward+' '+s.name)}">地図で確認 ↗</button></div></div>`).join('')}</div>`:''}
    <div class="section-title"><h2>${st.matches.length?'ほかの店舗を保存する':'② 店舗を手動で確認・保存'}</h2></div><div class="panel"><form id="socialSaveForm"><label class="field"><span>お店の名前（確認して入力）</span><input name="name" maxlength="160" value="${esc(st.guess)}" placeholder="例：気になったカフェ" required></label><div class="social-form-grid"><label class="field"><span>エリア</span><select name="ward"><option value="未設定">あとで決める</option>${WARDS.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('')}</select></label><label class="field"><span>ジャンル</span><select name="genre"><option value="未分類">未分類</option>${GENRES.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}</select></label></div><div class="inline-links"><button class="btn" type="button" data-action="mapQuery" data-query="${esc(st.guess||st.caption||'東京 グルメ')}">Googleマップで候補確認 ↗</button><button class="btn primary" type="submit">♡ 行きたいに保存</button></div></form></div>
    <div class="section-title"><h2>後で特定するリンク <small>${pending.length}件</small></h2></div>${pending.length?pending.map(p=>`<div class="social-result"><div class="small-title">${esc(p.kind||'SNS')} / 未特定</div><div style="font-weight:700;margin:3px 0">${esc((p.caption||p.url).slice(0,75))}</div><div class="inline-links"><a class="btn tiny" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">投稿を開く ↗</a><button class="btn tiny" data-action="loadPending" data-id="${esc(p.id)}">候補を探す</button><button class="btn tiny danger" data-action="deletePending" data-id="${esc(p.id)}">削除</button></div></div>`).join(''):'<p class="muted">未特定のリンクはありません。</p>'}
    <p class="info-note">URLからの自動判定は試験機能です。動画を直接解析・OCRする機能や、すべてのTikTok動画の位置を特定する機能ではありません。必ずGoogleマップ等で店名・場所をご確認ください。</p>`}
    function mapSearchPage(){return pageHeader('GOOGLE MAPS / FIND','地図から、次のお店を探す。','Googleマップの店舗検索を開いて、新しい候補を探せます。')+`
    <div class="nearby-panel"><h2>今いる場所から探す</h2><p>位置情報は「近くのお店を探す」を押した時だけ使います。結果はGoogleマップで表示します。</p><div class="nearby-buttons"><button class="btn primary" data-action="nearMe" data-kind="カフェ">⌖ 近くのカフェ</button><button class="btn" data-action="nearMe" data-kind="ラーメン">近くのラーメン</button><button class="btn" data-action="nearMe" data-kind="飲食店">近くの飲食店</button></div><small>位置情報を許可しない場合は下のエリア検索を使えます。</small></div><div class="social-hero"><div class="small-title">DISCOVER ON MAPS</div><h2>今日はどの街で、何食べる？</h2><p>気になる料理と街を組み合わせてGoogleマップで検索。調べたお店をGOURMET LOGに保存しよう。</p></div>
    <div class="panel"><h3>① Googleマップで検索する</h3><form id="mapSearchForm"><label class="field"><span>食べたい料理・店名</span><input name="mapTerm" value="${esc(mapState.query)}" placeholder="例：ハンバーグ / カフェ / 焼肉" required></label><label class="field"><span>検索エリア</span><select name="mapWard"><option value="東京">東京全体</option>${WARDS.map(w=>`<option ${mapState.ward===w?'selected':''}>${esc(w)}</option>`).join('')}</select></label><button class="btn primary" type="submit">⌖ Googleマップで探す ↗</button></form>
    <div class="social-kpis">${['北千住 カフェ','亀有 ラーメン','渋谷 ハンバーグ','新宿 イタリアン','池袋 スイーツ'].map(x=>`<button class="btn tiny ghost" data-action="mapQuery" data-query="${esc('東京 '+x)}">${esc(x)} ↗</button>`).join('')}</div></div>
    <div class="section-title"><h2>② 見つけたお店を保存する</h2></div><div class="panel"><p class="muted">Googleマップで確認した店名を入力してください。この無料版では検索結果を自動取り込みせず、ユーザーが選んだお店を保存します。</p><form id="mapSaveForm"><label class="field"><span>店名</span><input name="name" maxlength="160" required placeholder="Googleマップで見つけた店名"></label><div class="social-form-grid"><label class="field"><span>区</span><select name="ward"><option value="未設定">後で設定する</option>${WARDS.map(x=>`<option ${mapState.ward===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field"><span>ジャンル</span><select name="genre"><option value="未分類">未分類</option>${GENRES.map(g=>`<option>${esc(g)}</option>`).join('')}</select></label></div><button class="btn primary" type="submit">♡ 行きたいに追加する</button></form></div>
    <div class="privacy-note" style="margin-top:17px"><strong>Google Maps連携の現状</strong><br>現在は検索結果をGoogleマップアプリで表示する方式です。アプリ内でリアルタイムに店舗一覧・評価・写真を読み込むには、Google Places APIと請求設定が別途必要です。地図検索はAPIキーなしで使えます。</div>`}
    function extractGuess(caption){const lines=caption.split(/\n|。/).map(x=>x.trim()).filter(Boolean);for(const line of lines){let m=line.match(/(?:店名|店舗名|お店|SHOP|Restaurant)\s*[:：→=\-]\s*([^#\n【】。\s]{2,30}(?: [^#\n【】。]{1,25})?)/i);if(m)return m[1].trim().replace(/[!！✨📍🍴]+$/u,'')}return ''}
    function analyzeSocial(inputCaption,heading=''){let body=(inputCaption+'\n'+heading).normalize('NFKC').toLowerCase();socialState.matches=getShops().filter(s=>{let n=s.name.normalize('NFKC').toLowerCase();return n.length>=3&&body.includes(n)});socialState.guess=extractGuess(inputCaption)||extractGuess(heading)||'';socialState.message=socialState.matches.length?'既存の登録店舗と一致する名前が見つかりました。必ず投稿と地図で同一店舗か確認してから保存してください。':(socialState.guess?'店名らしい記述を抽出しました。誤認防止のため、Googleマップで確認してから保存してください。':'店舗名を確定できませんでした。投稿の説明文を貼るか、地図で確認後に店名を入力してください。');}
    async function getTikTokTitle(url){try{const c=new AbortController();let tid=setTimeout(()=>c.abort(),6500);let r=await fetch('/.netlify/functions/tiktok?url='+encodeURIComponent(url),{signal:c.signal});clearTimeout(tid);if(!r.ok)return '';let d=await r.json();return typeof d.title==='string'?d.title.slice(0,350):''}catch(_){return ''}}
    function addSocialSource(shopId,url,caption){let previous=store.mods[shopId]||{},sources=[...(previous.sources||[])];if(url&&!sources.some(x=>x.url===url))sources.push({kind:isTikTok(url)?'TikTok':'Instagram',url,caption:caption.slice(0,1200),savedAt:new Date().toISOString()});store.mods[shopId]={...previous,status:'wish',sources};socialPins();store.socialPins=store.socialPins.filter(p=>p.url!==url);save();render();toast('SNSの保存元を付けて「行きたい」に登録しました')}
    function saveNewPlace(name,ward,genre,source='',caption=''){name=name.trim();if(!name)return toast('店名を入力してください');const dup=getShops().find(x=>x.ward===ward&&x.name.toLowerCase()===name.toLowerCase());if(dup){addSocialSource(dup.id,source,caption);return}let uid=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'sns-'+Date.now()+'-'+Math.random().toString(36).slice(2);let region=SEED.find(s=>s.ward===ward)?.region||'未分類';let o={id:uid,name:name.slice(0,160),ward,region,genre,seed:false,notes:caption.slice(0,400),sources:source?[{kind:isTikTok(source)?'TikTok':'Instagram',url:source,caption:caption.slice(0,1200),savedAt:new Date().toISOString()}]:[]};store.custom.push(o);store.mods[uid]={status:'wish'};store.socialPins=socialPins().filter(p=>p.url!==source);save();render();toast('新しいお店を「行きたい」に追加しました')}

    document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){switchTab(t.dataset.tab);return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='toggleFilters'){ui.filtersOpen=!ui.filtersOpen;render();document.getElementById('homeFiltersToggle')?.focus({preventScroll:true});return;}if(a==='clearFilters')clearFilters();if(a==='loadMore'){ui.page++;render()}if(a==='wish'){let s=getShop(id);if(s)setStatus(id,statusOf(s)==='wish'?'new':'wish')}if(a==='detail')detail(id);if(a==='map'){let s=getShop(id);if(s)window.open(mapUrl(s),'_blank','noopener,noreferrer')}if(a==='close')closeDialog(b);if(a==='addShop')addShop();if(a==='editShop'){document.getElementById('detailDialog').close();addShop(id)}if(a==='saveNotes'){let s=getShop(id);if(!s)return;store.mods[id]={...(store.mods[id]||{}),notes:document.getElementById('shopNotes').value};save();toast('メモを保存しました')}if(a==='deleteShop'){if(!confirm('この店舗を一覧から削除（非表示）しますか？ 訪問履歴はバックアップに残ります。'))return;store.hidden=[...new Set([...store.hidden,id])];save();document.getElementById('detailDialog').close();render();toast('一覧から削除しました')}if(a==='editVisit'){const v=store.visits.find(x=>x.id===b.dataset.visit);const f=document.getElementById('visitForm');if(v&&f){f.dataset.editId=v.id;f.elements.date.value=v.date;f.elements.rating.value=String(v.rating);f.elements.amount.value=v.amount??'';f.elements.dish.value=v.dish??'';f.elements.note.value=v.note??'';f.elements.revisit.value=v.revisit??'';f.querySelector('button[type=submit]').textContent='訪問記録を更新';f.scrollIntoView({behavior:'smooth',block:'center'});toast('編集内容を入力して更新してください')}}if(a==='deleteVisit'){if(!confirm('この訪問記録を削除しますか？'))return;store.visits=store.visits.filter(x=>x.id!==b.dataset.visit);save();detail(id);render();toast('訪問記録を削除しました')}if(a==='discover')switchTab('discover');if(a==='reroll'){let old=ui.discoverId,pick=randomShop();if(pick&&pick.id===old&&getShops().length>1){for(let i=0;i<8&&pick.id===old;i++)pick=randomShop()}ui.discoverId=pick?.id;render()}if(a==='share')copyText();if(a==='export')exportJson();if(a==='import'){incoming=null;importDialog()}if(a==='applyImport')applyImport(b.dataset.mode)});
    document.addEventListener('change',async e=>{if(['region','ward','genre','status','sort'].includes(e.target.id)){ui[e.target.id]=e.target.value;ui.page=1;if(e.target.id==='region')ui.ward='all';render()}if(e.target.id==='modalStatus'){setStatus(e.target.dataset.id,e.target.value)}if(e.target.id==='importFile'){const f=e.target.files?.[0];if(!f)return;try{if(f.size>8e6)throw Error('ファイルが大きすぎます');previewImport(JSON.parse(await f.text()))}catch(err){incoming=null;document.getElementById('importPreview').innerHTML=`<div class="data-preview" style="border-color:#7d4442;color:var(--danger)">${esc(err.message)}</div>`}}});
    document.addEventListener('input',e=>{if(e.target.id==='keyword'){ui.keyword=e.target.value;ui.page=1;const section=document.getElementById('results');if(section)section.outerHTML=resultsView();}});
    document.addEventListener('submit',e=>{if(e.target.id==='homeSearchForm'){e.preventDefault();ui.keyword=String(new FormData(e.target).get('homeKeyword')||'').trim().slice(0,120);ui.region='all';ui.ward='all';ui.status='all';ui.genre='all';ui.page=1;render();document.getElementById('results')?.scrollIntoView({behavior:'smooth',block:'start'});return;}if(e.target.id==='visitForm'){e.preventDefault();const f=e.target,id=f.dataset.id,form=new FormData(f);const previous=f.dataset.editId;const entry={id:previous||'visit-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),shopId:id,date:String(form.get('date')||''),rating:Number(form.get('rating'))||0,amount:String(form.get('amount')||''),dish:String(form.get('dish')||'').slice(0,100),note:String(form.get('note')||'').slice(0,3000),revisit:String(form.get('revisit')||'')};if(previous)store.visits=store.visits.map(x=>x.id===previous?entry:x);else store.visits.push(entry);store.mods[id]={...(store.mods[id]||{}),status:'visited'};save();detail(id);render();toast('訪問記録を保存しました')}if(e.target.id==='addForm'){e.preventDefault();const f=e.target,form=new FormData(f),name=String(form.get('name')||'').trim(),ward=String(form.get('ward')||''),genre=String(form.get('genre')||''),notes=String(form.get('notes')||'').slice(0,4000),id=f.dataset.edit;if(!name||!WARDS.includes(ward)||!genre){toast('必須項目を確認してください');return}const region=SEED.find(s=>s.ward===ward)?.region||'都心';if(id){if(store.custom.some(s=>s.id===id))store.custom=store.custom.map(s=>s.id===id?{...s,name,ward,region,genre,notes}:s);else store.mods[id]={...(store.mods[id]||{}),name,ward,region,genre,notes}}else{const uid=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'new-'+Date.now()+'-'+Math.random().toString(36).slice(2);store.custom.push({id:uid,name,ward,region,genre,notes,seed:false})}save();document.getElementById('addDialog').close();render();toast(id?'店舗情報を更新しました':'お店を追加しました')}});

    document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='mapQuery'){window.open(makeMapsUrl(b.dataset.query||'東京都 グルメ'),'_blank','noopener,noreferrer')}
      if(a==='savePending'){let url=safeSocialUrl(document.querySelector('input[name="socialUrl"]')?.value||socialState.url);let caption=document.querySelector('textarea[name="socialCaption"]')?.value||socialState.caption;if(!url)return toast('TikTokまたはInstagramのURLを入力してください');if(socialPins().some(x=>x.url===url))return toast('このリンクはすでに保存されています');socialPins().push({id:'clip-'+Date.now()+'-'+Math.random().toString(36).slice(2),url,caption:caption.slice(0,2000),kind:isTikTok(url)?'TikTok':'Instagram',savedAt:new Date().toISOString()});socialState.url=url;socialState.caption=caption;save();render();toast('後で確認するリンクとして保存しました')}
      if(a==='deletePending'){if(!confirm('この保存リンクを削除しますか？'))return;store.socialPins=socialPins().filter(p=>p.id!==b.dataset.id);save();render()}
      if(a==='loadPending'){let p=socialPins().find(x=>x.id===b.dataset.id);if(!p)return;socialState.url=p.url;socialState.caption=p.caption||'';socialState.headline='';analyzeSocial(socialState.caption);render();window.scrollTo({top:0,behavior:'smooth'})}
      if(a==='socialSaveExisting'){let s=getShop(b.dataset.id);if(!s)return;let url=safeSocialUrl(socialState.url);if(!url)return toast('SNSリンクを先に入力してください');addSocialSource(s.id,url,socialState.caption)}
    });
    document.addEventListener('submit',async e=>{if(e.target.id==='socialForm'){e.preventDefault();const f=e.target;let raw=new FormData(f),url=safeSocialUrl(raw.get('socialUrl')),cap=String(raw.get('socialCaption')||'').slice(0,4000);if(!url)return toast('TikTokかInstagramの共有リンクを入力してください');socialState={...socialState,url,caption:cap,busy:true};render();let title=isTikTok(url)?await getTikTokTitle(url):'';socialState={...socialState,busy:false,headline:title};analyzeSocial(cap,title);if(title&&!cap)socialState.message+=' 取得できた投稿タイトルも候補検索に利用しました。';render()}
      if(e.target.id==='socialSaveForm'){e.preventDefault();const f=new FormData(e.target);saveNewPlace(String(f.get('name')||''),String(f.get('ward')||'未設定'),String(f.get('genre')||'未分類'),safeSocialUrl(socialState.url),socialState.caption)}
      if(e.target.id==='mapSearchForm'){e.preventDefault();let f=new FormData(e.target);mapState.query=String(f.get('mapTerm')||'').trim();mapState.ward=String(f.get('mapWard')||'東京');if(!mapState.query)return toast('店名か料理名を入力してください');window.open(makeMapsUrl('東京都 '+mapState.ward+' '+mapState.query),'_blank','noopener,noreferrer')}
      if(e.target.id==='mapSaveForm'){e.preventDefault();let f=new FormData(e.target);saveNewPlace(String(f.get('name')||''),String(f.get('ward')||'未設定'),String(f.get('genre')||'未分類'))}
    });
    if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});

    document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
      if(action==='exportPhotos'){exportPhotoBackup();return}
      if(action==='viewPhoto'){const u=photoObjects.get(b.dataset.photo);if(u)showDialog('photoViewer',`<div class="photo-viewer-bar"><strong>写真を見る</strong><button data-action="close" class="close" aria-label="閉じる">×</button></div><img class="photo-viewer-image" src="${u}" alt="登録した店舗写真">`);return}
      if(action==='genreChip'){ui.genre=b.dataset.genre||'all';ui.keyword='';ui.region='all';ui.ward='all';ui.status='all';ui.filtersOpen=false;ui.page=1;render();document.getElementById('results')?.scrollIntoView({behavior:'smooth',block:'start'});return}
      if(action==='deletePhoto'){if(confirm('この写真を削除しますか？')){await deletePhotoFile(b.dataset.photo);let dlg=document.getElementById('detailDialog');if(dlg.open)detail(b.dataset.id)}return}
      if(action==='nearMe'){if(!navigator.geolocation){toast('この端末では位置情報を使えません');return}toast('位置情報の利用確認を表示します');navigator.geolocation.getCurrentPosition(position=>{const kind=b.dataset.kind||'飲食店';const q=`${kind} near ${position.coords.latitude},${position.coords.longitude}`;window.location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)},()=>toast('位置情報を取得できませんでした。エリアを指定して検索できます。'),{enableHighAccuracy:false,timeout:9000,maximumAge:60000});return}
    });
    document.addEventListener('change',async e=>{if(e.target.id==='photoImportFile'){await importPhotoBackup(e.target.files?.[0]);e.target.value='';return}if(e.target.id==='photoUpload'){const shopId=e.target.dataset.shop;for(const f of Array.from(e.target.files||[]).slice(0,8))await addPhotoFile(shopId,f);e.target.value=''}});
    document.addEventListener('click',function(event){
      const themeButton=event.target.closest('[data-action="toggleTheme"]');
      if(!themeButton)return;
      const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
      window.__tglApplyTheme(next,true);
      render();
    });
    render();
    loadPhotos();
  </script>
